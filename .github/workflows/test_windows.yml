# Run tests on Windows.
name: test_windows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test_windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - os: windows-2025
          python-version: '3.14'
          toxenv: 'py314'
        - os: windows-2025
          python-version: '3.14'
          toxenv: 'end2end'
    steps:
    - name: Configure git
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'tox.ini'
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Install pywin32 to ensure sys.platform is working as expected
      shell: cmd
      env:
        PYTHON: ${{ env.pythonLocation }}
      run: |
        python -m pip install pywin32
        python "%PYTHON%\Scripts\pywin32_postinstall.py" -install
    - name: Run tests
      env:
        PIP_CACHE_DIR: ~\AppData\Local\pip\Cache
      run: |
        tox -e ${{ matrix.toxenv }}
