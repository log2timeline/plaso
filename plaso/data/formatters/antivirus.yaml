    '10': 'GL_EVENT_CHECKSUM'
    '11': 'GL_EVENT_TRAP'
    '12': 'GL_EVENT_CONFIG_CHANGE'
    '13': 'GL_EVENT_SHUTDOWN'
    '14': 'GL_EVENT_STARTUP'
