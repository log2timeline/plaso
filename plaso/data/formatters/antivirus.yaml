# Plaso anti-virus related event formatters.
---
type: 'conditional'
data_type: 'av:defender:detection_history'
enumeration_helpers:
- input_attribute: 'category'
  output_attribute: 'category_string'
  values:
    0: 'Invalid'
    1: 'Adware'
    2: 'Spyware'
    3: 'Password stealer'
    4: 'Trojan downloader'
    5: 'Worm'
    6: 'Backdoor'
    7: 'Remote access Trojan'
    8: 'Trojan'
    9: 'Email flooder'
    10: 'Keylogger'
    11: 'Dialer'
    12: 'Monitoring software'
    13: 'Browser modifier'
    14: 'Cookie'
    15: 'Browser plugin'
    16: 'AOL exploit'
    17: 'Nuker'
    18: 'Security disabler'
    19: 'Joke program'
    20: 'Hostile ActiveX control'
    21: 'Software bundler'
    22: 'Stealth notifier'
    23: 'Settings modifier'
    24: 'Toolbar'
    25: 'Remote control software'
    26: 'Trojan FTP'
    27: 'Potential unwanted software'
    28: 'ICQ exploit'
    29: 'Trojan telnet'
    30: 'Exploit'
    31: 'File sharing program'
    32: 'Malware creation tool'
    33: 'Remote control software'
    34: 'Tool'
    36: 'Trojan denial of service'
    37: 'Trojan dropper'
    38: 'Trojan mass mailer'
    39: 'Trojan monitoring software'
    40: 'Trojan proxy server'
    42: 'Virus'
    43: 'Known'
    44: 'Unknown'
    45: 'SPP'
    46: 'Behavior'
    47: 'Vulnerability'
    48: 'Policy'
    49: 'EUS (Enterprise Unwanted Software)'
    50: 'Ransomware'
    51: 'ASR Rule'
- input_attribute: 'severity'
  output_attribute: 'severity_string'
  values:
    0: 'Unknown'
    1: 'Low'
    2: 'Moderate'
    4: 'High'
    5: 'Severe'
- input_attribute: 'threat_status'
  output_attribute: 'threat_status_string'
  values:
    0: 'Unknown'
    1: 'Detected'
    2: 'Cleaned'
    3: 'Quarantined'
    4: 'Removed'
    5: 'Allowed'
    6: 'Blocked'
    102: 'Clean failed'
    103: 'Quarantine failed'
    104: 'Remove failed'
    105: 'Allow failed'
    106: 'Abandoned'
    107: 'Block failed'
message:
- 'File Name: {filename}'
- 'Hash: {sha256}'
- 'User: {host_and_user}'
- '{threat_name}'
- 'Threat identifier: {threat_identifier}'
- 'Severity: {severity_string}'
- 'Category: {category_string}'
- 'Status: {threat_status_string}'
- 'Process: {process}'
- '{container_filenames}'
- '{web_filenames}'
- '{additional_filenames}'
- 'Remediation account: {remediation_account}'
short_message:
- '{filename}'
- '{threat_name}'
short_source: 'LOG'
source: 'Windows Defender Detection History Log'
---
type: 'conditional'
data_type: 'av:mcafee:accessprotectionlog'
message:
- 'File Name: {filename}'
- 'User: {username}'
- '{trigger_location}'
- '{status}'
- '{rule}'
- '{action}'
short_message:
- '{filename}'
- '{action}'
short_source: 'LOG'
source: 'McAfee Access Protection Log'
